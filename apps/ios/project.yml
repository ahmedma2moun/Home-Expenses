name: HomeExpenses
options:
  bundleIdPrefix: com.homeexpenses
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  HomeExpenses:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HomeExpenses
        excludes:
          - Resources/Info.plist
          - Resources/Debug.xcconfig
          - Resources/Release.xcconfig
    configFiles:
      Debug: HomeExpenses/Resources/Debug.xcconfig
      Release: HomeExpenses/Resources/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homeexpenses.HomeExpenses
        PRODUCT_NAME: HomeExpenses
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: true
        # Plain existing file — do NOT use xcodegen's `info:` block here. That block treats the
        # path as an output it owns and REGENERATES it from `properties:` on every `generate`,
        # silently deleting hand-written keys (API_BASE_URL, usage descriptions). Learned the hard
        # way — see git history on Resources/Info.plist.
        INFOPLIST_FILE: HomeExpenses/Resources/Info.plist
    scheme:
      testTargets: []
      gatherCoverageData: false
